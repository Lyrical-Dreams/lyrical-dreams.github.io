<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography · Nayan Pillai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="photography">

<div class="scanline" aria-hidden="true"></div>
<div id="site-header"></div>

<main>
  <section class="page-hero wrap">
    <p class="eyebrow mono">Photography</p>
    <h1 class="page-title">Off the clock</h1>
    <p class="page-subtitle">A more personal side of things. Click any photo to view it enlarged.</p>
  </section>

  <section class="section wrap">
    <!--
      HOW TO ADD YOUR OWN PHOTOS
      ===========================
      1. Drop your image files into images/photography/, e.g.
         images/photography/nature/sunset.jpg
      2. Each photo is one <figure class="photo-item"> block below. Copy one,
         point the src at your file, write a real caption.
      3. To add a new category, copy a whole <div class="photo-category"> block
         and rename the heading.
      4. Delete the placeholder-N.svg files once every placeholder has been
         swapped for a real photo — see the chat for a note on compressing
         iPhone photos before uploading them.
    -->

    <div class="photo-category">
      <h2 class="photo-category-title">Nature <span class="mono">// landscapes, wildlife, plants</span></h2>
      <div class="photo-grid">
        <figure class="photo-item">
          <img src="images/photography/palm%trees20.jpg" alt="Palm Trees in Seaside" loading="lazy">
          <figcaption>Seaside 30A</figcaption>
        </figure>
        <figure class="photo-item">
          <img src="images/photography/kerala.jpg" alt="Vande Bharat" loading="lazy">
          <figcaption>Kerala, India</figcaption>
        </figure>
      </div>
    </div>

    <div class="photo-category">
      <h2 class="photo-category-title">Cities <span class="mono">// street, architecture, travel</span></h2>
      <div class="photo-grid">
        <figure class="photo-item">
          <img src="images/photography/kinetic%20midtown.jpg" alt="Kinetic Midtown" loading="lazy">
          <figcaption>Downtown Atlanta skyline captured from Midtown</figcaption>
        </figure>
        <figure class="photo-item">
          <img src="images/photography/downtown.jpg" alt="Westin" loading="lazy">
          <figcaption>The Sun Dial: Westin</figcaption>
        </figure>
      </div>
    </div>

    <div class="photo-category">
      <h2 class="photo-category-title">Pets <span class="mono">// the important stuff</span></h2>
      <div class="photo-grid">
        <figure class="photo-item">
          <img src="images/photography/Sulley1.jpg" alt="Sulley" loading="lazy">
          <figcaption>Sulley (From Monsters Inc.)</figcaption>
        </figure>
        <figure class="photo-item">
          <img src="images/photography/Sulley2.jpg" alt="Snowy Sulley" loading="lazy">
          <figcaption>Snowy Sulley</figcaption>
        </figure>
      </div>
    </div>

    <!-- Add more categories as needed: Food, Events, Friends, Sports, whatever fits your library -->
  </section>
</main>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script src="js/lightbox.js"></script>
</body>
</html>
