<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography · Nayan Pillai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="photography">

<div class="scanline" aria-hidden="true"></div>
<div id="site-header"></div>

<main>
  <section class="page-hero wrap">
    <p class="eyebrow mono">Photography</p>
    <h1 class="page-title">Off the clock</h1>
    <p class="page-subtitle">A more personal side of things. Each category flips through on its own — use the arrows, click a peeking photo, or just wait a few seconds.</p>
  </section>

  <section class="section wrap">
    <!--
      HOW TO ADD YOUR OWN PHOTOS
      ===========================
      1. Drop your image files into images/photography/.
      2. Each photo is one <figure class="photo-item"> block inside a
         .photo-carousel. Copy one, point the src at your file, write a
         real caption. The carousel and lightbox both pick up new figures
         automatically — no JS changes needed.
      3. To add a new category (e.g. Landscapes), copy a whole
         .photo-category block, give it a unique data-category value,
         and rename the heading.
    -->

    <div class="photo-category" data-category="nature">
      <h2 class="photo-category-title">Nature <span class="mono">// landscapes, wildlife, plants</span></h2>
      <div class="photo-carousel">
        <button class="carousel-btn carousel-prev" aria-label="Previous photo">&#8249;</button>
        <div class="photo-carousel-viewport">
          <div class="photo-track">
            <figure class="photo-item">
              <img src="images/photography/palm-trees.jpg" alt="Palm Trees in Seaside">
              <figcaption class="sr-only">Seaside 30A</figcaption>
            </figure>
            <figure class="photo-item">
              <img src="images/photography/kerala.jpg" alt="Vande Bharat">
              <figcaption class="sr-only">Kerala, India</figcaption>
            </figure>
          </div>
        </div>
        <button class="carousel-btn carousel-next" aria-label="Next photo">&#8250;</button>
      </div>
      <p class="carousel-caption" aria-live="polite"></p>
      <p class="carousel-counter mono"></p>
    </div>

    <div class="photo-category" data-category="cities">
      <h2 class="photo-category-title">Cities <span class="mono">// street, architecture, travel</span></h2>
      <div class="photo-carousel">
        <button class="carousel-btn carousel-prev" aria-label="Previous photo">&#8249;</button>
        <div class="photo-carousel-viewport">
          <div class="photo-track">
            <figure class="photo-item">
              <img src="images/photography/kinetic-midtown.jpg" alt="Kinetic Midtown">
              <figcaption class="sr-only">Downtown Atlanta skyline captured from Midtown</figcaption>
            </figure>
            <figure class="photo-item">
              <img src="images/photography/downtown.jpg" alt="Westin">
              <figcaption class="sr-only">The Sun Dial: Westin</figcaption>
            </figure>
          </div>
        </div>
        <button class="carousel-btn carousel-next" aria-label="Next photo">&#8250;</button>
      </div>
      <p class="carousel-caption" aria-live="polite"></p>
      <p class="carousel-counter mono"></p>
    </div>

    <div class="photo-category" data-category="pets">
      <h2 class="photo-category-title">Pets <span class="mono">// the important stuff</span></h2>
      <div class="photo-carousel">
        <button class="carousel-btn carousel-prev" aria-label="Previous photo">&#8249;</button>
        <div class="photo-carousel-viewport">
          <div class="photo-track">
            <figure class="photo-item">
              <img src="images/photography/Sulley1.jpg" alt="Sulley">
              <figcaption class="sr-only">Sulley (From Monsters Inc.)</figcaption>
            </figure>
            <figure class="photo-item">
              <img src="images/photography/Sulley2.jpg" alt="Snowy Sulley">
              <figcaption class="sr-only">Snowy Sulley</figcaption>
            </figure>
          </div>
        </div>
        <button class="carousel-btn carousel-next" aria-label="Next photo">&#8250;</button>
      </div>
      <p class="carousel-caption" aria-live="polite"></p>
      <p class="carousel-counter mono"></p>
    </div>

    <!-- Add more categories as needed: Landscapes, Food, Events, Friends, Sports -->
  </section>
</main>

<div id="site-footer"></div>
<script src="js/site.js"></script>
<script src="js/carousel.js"></script>
<script src="js/lightbox.js"></script>
</body>
</html>
